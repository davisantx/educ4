<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Painel Admin</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Painel Administrativo - Bem-vindo, {{ nome }}.</h2>
            <div>
                <a href="{{ url_for('produtos') }}" class="btn btn-outline-primary me-2">Produtos</a>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Sair</a>
            </div>
        </div>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <div class="card p-3 shadow-sm mb-4">
            <h4>Cadastrar Usuário</h4>
            <form method="POST" action="{{ url_for('painel_admin') }}">
                <input
                    type="text"
                    name="nome"
                    placeholder="Nome"
                    class="form-control mb-2"
                    required
                />
                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    class="form-control mb-2"
                    required
                />
                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    class="form-control mb-2"
                    required
                />
                <select name="perfil" class="form-control mb-2">
                    <option value="comum">Comum</option>
                    <option value="admin">Administrador</option>
                </select>
                <button class="btn btn-success w-100">Salvar Usuário</button>
            </form>
        </div>

        <div class="card p-3 shadow-sm mb-4">
            <h4>Usuários Cadastrados</h4>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in usuarios %}
                        <tr>
                            <td>{{ u.id }}</td>
                            <td><b>{{ u.nome }}</b></td>
                            <td>{{ u.email }}</td>
                            <td>
                                <span
                                    class="badge {% if u.perfil == 'admin' %}bg-danger{% else %}bg-secondary{% endif %}"
                                    >{{ u.perfil }}</span
                                >
                            </td>
                            <td>
                                <a
                                    href="{{ url_for('editar_usuario', id_usuario=u.id) }}"
                                    class="btn btn-primary btn-sm"
                                >
                                    Alterar
                                </a>
                                {% if u.id != id %}
                                <form
                                    method="POST"
                                    action="{{ url_for('excluir_usuario', id_usuario=u.id) }}"
                                    class="d-inline"
                                    onsubmit="return confirm('Tem certeza que deseja excluir este usuário?');"
                                >
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        Excluir
                                    </button>
                                </form>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
