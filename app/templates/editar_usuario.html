<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Alterar Usuário</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Alterar Usuário #{{ usuario.id }}</h2>
            <a href="{{ url_for('painel_admin') }}" class="btn btn-outline-secondary">Voltar</a>
        </div>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <div class="card p-3 shadow-sm">
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label">Nome</label>
                    <input
                        type="text"
                        name="nome"
                        value="{{ usuario.nome }}"
                        class="form-control"
                        required
                    />
                </div>
                <div class="mb-2">
                    <label class="form-label">E-mail</label>
                    <input
                        type="email"
                        name="email"
                        value="{{ usuario.email }}"
                        class="form-control"
                        required
                    />
                </div>
                <div class="mb-2">
                    <label class="form-label">Nova Senha (deixe em branco para manter a atual)</label>
                    <input
                        type="password"
                        name="senha"
                        placeholder="Nova senha (opcional)"
                        class="form-control"
                    />
                </div>
                <div class="mb-3">
                    <label class="form-label">Perfil</label>
                    <select name="perfil" class="form-control">
                        {% if usuario.id != id %}
                        <option value="comum" {% if usuario.perfil == 'comum' %}selected{% endif %}>Comum</option>
                        {% endif %}
                        <option value="admin" {% if usuario.perfil == 'admin' %}selected{% endif %}>Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                <a href="{{ url_for('painel_admin') }}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </body>
</html>
